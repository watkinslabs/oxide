name: pr

# On-demand diagnostics only. Local gates own merge verification per docs/40.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-lint:
    name: spec-lint
    # Temporary: keep this lane out of the required PR path until the current
    # baseline findings are paid down. Set repo variable OXIDE_RUN_SPEC_LINT=1
    # to re-enable without changing the workflow again.
    if: ${{ vars.OXIDE_RUN_SPEC_LINT == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain
        run: rustup show
      - name: spec-lint all
        run: cargo run --quiet -p spec-lint -- all

  # Unconditional, unlike `spec-lint` above: the full lint is disabled behind
  # OXIDE_RUN_SPEC_LINT until its backlog is paid down, which is how the backlog
  # reached 2696 unobserved. This job gates the DERIVATIVE — findings per
  # (crate, rule) may not exceed `tools/spec-lint/baseline.tsv` — so a new
  # violation fails even inside a crate that already has hundreds. Under a
  # second after the build.
  lint-ratchet:
    name: lint-ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain
        run: rustup show
      - name: spec-lint ratchet
        run: cargo run --quiet -p spec-lint -- ratchet

  warnings-hosted:
    name: warnings --hosted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain
        run: rustup show
      - name: warnings-gate controls
        run: python3 tools/warnings-gate.py --self-test
      - name: workspace build with warnings denied
        run: python3 tools/warnings-gate.py -- cargo build --workspace

  test-hosted:
    name: test --hosted
    # Temporary: hosted tests currently fail on missing fixture state. Set repo
    # variable OXIDE_RUN_HOSTED_TESTS=1 to re-enable this job.
    if: ${{ vars.OXIDE_RUN_HOSTED_TESTS == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain
        run: rustup show
      - name: cargo test workspace
        run: python3 tools/warnings-gate.py -- cargo test --workspace --quiet

  # Build both arches under both feature configs per `04§3` recipe
  # ("release no-features, release debug-all"). Boot-smoke is a
  # local-only gate (see `tools/boot-smoke.sh`, the pre-push hook
  # under `.githooks/pre-push`, and CLAUDE.md§"Boot smoke before
  # push") — hosted-runner TCG boots cost ~10-15min/arch/PR which
  # isn't worth the GHA budget.
  build-kernel:
    name: build kernel ${{ matrix.arch }} (${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        profile:
          - { name: default,   features: "" }
          - { name: debug-all, features: "debug-all" }
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain
        run: rustup show
      - name: install rust-src
        run: rustup component add rust-src --toolchain $(rustup show active-toolchain | awk '{print $1}')
      - name: xtask kernel --arch ${{ matrix.arch }} (${{ matrix.profile.name }})
        # Compile-check only: build and validate the real per-arch vDSO, then
        # skip rootfs generation because CI does not boot.
        env:
          OXIDE_STUB_BLOBS: "1"
        run: |
          if [ -z "${{ matrix.profile.features }}" ]; then
            python3 tools/warnings-gate.py -- cargo run --quiet -p xtask -- kernel --arch ${{ matrix.arch }} --profile dev
          else
            python3 tools/warnings-gate.py -- cargo run --quiet -p xtask -- kernel --arch ${{ matrix.arch }} --profile dev --features ${{ matrix.profile.features }}
          fi

  # Kernel stack gates. Both read an already-linked RELEASE ELF — the baselines
  # are release numbers, and a dev build's frames are not comparable — so this
  # builds release rather than reusing the compile-check job above.
  #
  # frame-size-gate  : any single frame >= 8 KiB (Linux CONFIG_FRAME_WARN shape)
  # stack-depth-gate : any static CALL PATH >= 13 KiB of the 16 KiB kernel stack
  #
  # The second exists because the first cannot see a chain of individually-legal
  # frames that sums past the stack, which is how the virtio child probe
  # overflowed on both arches.
  stack-gates:
    name: stack gates ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain
        run: rustup show
      - name: install rust-src
        run: rustup component add rust-src --toolchain $(rustup show active-toolchain | awk '{print $1}')
      # No `rustfilt` install: both gates demangle in-process via
      # tools/rust_symbol_identity.py, so their output and their allowlist
      # keys cannot depend on whether a demangler happened to be present.
      - name: parser + identity self-test
        run: |
          python3 tools/rust_symbol_identity.py
          python3 tools/frame-size-gate.py --self-test
          python3 tools/stack-depth-gate.py --self-test
      - name: build release kernel ${{ matrix.arch }}
        env:
          OXIDE_STUB_BLOBS: "1"
        run: python3 tools/warnings-gate.py -- cargo run --quiet -p xtask -- kernel --arch ${{ matrix.arch }}
      # The RELEASE, default-feature ELF — the same file `make stack-gate`
      # reads. Never target/artifacts, whose contents depend on which build
      # last exported (B1632).
      - name: locate kernel ELF
        id: elf
        run: |
          case "${{ matrix.arch }}" in
            x86_64)  echo "path=target/x86_64-unknown-oxide-kernel/release/oxide-x86_64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "path=target/aarch64-unknown-oxide-kernel/release/oxide-aarch64" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: frame-size gate
        run: |
          python3 tools/frame-size-gate.py "${{ steps.elf.outputs.path }}" \
            --baseline tools/frame-size-baseline-${{ matrix.arch }}.txt
      - name: stack-depth gate
        run: |
          python3 tools/stack-depth-gate.py "${{ steps.elf.outputs.path }}" \
            --arch ${{ matrix.arch }} --fail 13000 \
            --allowlist tools/stack-depth-allow-${{ matrix.arch }}.txt
