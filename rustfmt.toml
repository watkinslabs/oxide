# HARD GUARD: rustfmt is DISABLED repo-wide. The codebase uses a deliberate
# compact / AI-density style (docs/07, docs/08) — single-line if/else + for,
# aligned columns, tight bullets — that default rustfmt destroys. A `cargo fmt`
# once reformatted 679 files away from that style; this makes `cargo fmt` (and
# `cargo fmt --check`) a no-op so it can NEVER happen again. Do not remove.
disable_all_formatting = true
