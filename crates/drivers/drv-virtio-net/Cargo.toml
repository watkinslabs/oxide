[package]
name = "drv-virtio-net"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

# Modern-transport virtio-net driver per `34§*`. The transport wrapper
# populates ModernNetState; this crate owns live RX/TX paths and net stack
# integration.

[dependencies]
timer = { path = "../../kernel/timer" }
softirq  = { path = "../../kernel/softirq" }
hal      = { path = "../../arch/hal" }
klog     = { path = "../../shared/klog" }
net      = { path = "../../kernel/net" }
pmm      = { path = "../../kernel/mm-pmm" }
sync     = { path = "../../shared/sync" }
virtio   = { path = "../virtio" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[features]
default = []
debug-boot = []
# Host-test build: forward to net's hosted surface so `cargo test -p
# drv-virtio-net --features hosted` compiles the `net::sock` module the driver
# uses. No effect on the kernel target (which enables that surface via
# target_os = "oxide-kernel"). Off by default.
hosted = ["net/hosted"]
