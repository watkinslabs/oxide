[package]
name = "drm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal     = { path = "../../arch/hal" }
klog    = { path = "../../shared/klog" }
sync    = { path = "../../shared/sync" }
pmm     = { path = "../../kernel/mm-pmm" }
vfs     = { path = "../../kernel/vfs" }
devfs   = { path = "../../kernel/devfs" }
drv     = { path = "../drv" }
syscall = { path = "../../kernel/syscall" }
sched   = { path = "../../kernel/sched" }

[features]
debug-boot = []  # [DRMPROP] KMS plane/property ioctl trace (mutter primary-plane hunt)
debug-desktop = []  # [DRMPROP] KMS plane/property ioctl trace (mutter primary-plane hunt) — per-ioctl, split off debug-boot per B1474
