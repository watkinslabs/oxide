[package]
name="drv-zram"
version="0.1.0"
edition="2021"
publish=false
[lib]
path="src/lib.rs"
[features]
default=[]
hosted=[]
memory-tracking=[]
debug-zram-codecs=[]
debug-zram-lifecycle=[]
[dependencies]
klog = { path = "../../shared/klog" }
kalloc = { path = "../../shared/kalloc" }
block={path="../../kernel/block"}
hal={path="../../arch/hal"}
sched={path="../../kernel/sched"}
sync={path="../../shared/sync"}
movable={path="../../shared/movable"}
lz4_flex={version="0.14.0",default-features=false,features=["alloc","safe-encode","safe-decode"]}
miniz_oxide={version="0.8.9",default-features=false,features=["with-alloc"]}
lzokay={version="2.0.1",default-features=false,features=["compress","decompress","alloc"]}
zlib-rs={path="../../../vendor/rust/zlib-rs-0.6.6",default-features=false,features=["rust-allocator","kernel_scalar"]}
structured-zstd={path="../../../vendor/rust/structured-zstd-0.0.49",default-features=false,features=["kernel_scalar"]}

[dev-dependencies]
structured-zstd={path="../../../vendor/rust/structured-zstd-0.0.49",default-features=false,features=["kernel_scalar","dict_builder"]}

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64={path="../../arch/hal-x86_64"}

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64={path="../../arch/hal-aarch64"}
