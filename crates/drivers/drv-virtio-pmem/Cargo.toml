[package]
name = "drv-virtio-pmem"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
block = { path = "../../kernel/block" }
drv = { path = "../drv" }
hal = { path = "../../arch/hal" }
iommu = { path = "../../kernel/iommu" }
pci = { path = "../pci" }
pmm = { path = "../../kernel/mm-pmm" }
sched = { path = "../../kernel/sched" }
sync = { path = "../../shared/sync" }
virtio = { path = "../virtio" }
klog = { path = "../../shared/klog", optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[features]
default = []
debug-pmem = ["dep:klog"]

[lints]
workspace = true
