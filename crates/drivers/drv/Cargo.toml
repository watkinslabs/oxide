[package]
name = "drv"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal  = { path = "../../arch/hal" }
klog = { path = "../../shared/klog" }
sync = { path = "../../shared/sync" }
sched = { path = "../../kernel/sched" }
# device_add (Stage B) needs `vfs::InodeRef` to type the `/dev`-node factory
# the devtmpfs hook carries. vfs is no_std + does NOT depend on drv/devfs
# (acyclic); the forbidden edge is drv->devfs (the cgroup->devfs->sched cycle),
# which the DEVTMPFS_HOOK indirection avoids.
vfs  = { path = "../../kernel/vfs" }

[target.'cfg(not(target_os = "oxide-kernel"))'.dependencies]
sched = { path = "../../kernel/sched", features = ["hosted"] }

[lints]
workspace = true
