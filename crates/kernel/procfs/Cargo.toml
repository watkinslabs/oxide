[package]
name = "procfs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
aslr = { path = "../aslr" }
hal  = { path = "../../arch/hal" }
klog = { path = "../../shared/klog" }
sync = { path = "../../shared/sync" }
pmm  = { path = "../mm-pmm" }
cpu  = { path = "../cpu" }
block = { path = "../block" }
drv = { path = "../../drivers/drv" }
arch-irq = { path = "../arch-irq" }
vfs  = { path = "../vfs" }
net  = { path = "../net" }
modules = { path = "../modules" }
sched = { path = "../sched" }
syscall = { path = "../syscall" }
vmm   = { path = "../mm-vmm" }
devfs = { path = "../devfs" }
# `/proc/sys/kernel/random/uuid` regenerates per read from the ONE kernel
# CSPRNG (`27`); procfs never carries a second generator.
crng  = { path = "../crng" }
kernfs = { path = "../kernfs" }
nscg  = { path = "../nscg" }
network-namespace = { path = "../network-namespace" }
namespace-identity = { path = "../namespace-identity" }
sysfs = { path = "../sysfs" }
cgroup = { path = "../cgroup" }
# /proc/sys/fs/mqueue/* binds to the per-IPC-namespace values mq_open reads.
ipc = { path = "../ipc" }
slab = { path = "../../shared/slab" }
kmacros = { path = "../../shared/kmacros" }

[features]
debug-cgroup = []  # [PROCCG]/[OPENCG-adjacent] /proc/<pid>/cgroup read trace
debug-mntcost = []  # [MNTBUILD] per-render cost census for /proc/*/mountinfo + /proc/mounts (snapshot vs row-render split, row + global mount counts)
debug-mnt = []  # [MNTINFO] /proc mountinfo reader namespace/projection trace
default = []
hosted  = []

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[lints]
workspace = true
