[package]
name = "procfs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal  = { path = "../../arch/hal" }
klog = { path = "../../shared/klog" }
sync = { path = "../../shared/sync" }
pmm  = { path = "../mm-pmm" }
vfs  = { path = "../vfs" }
net  = { path = "../net" }
modules = { path = "../modules" }
sched = { path = "../sched" }
vmm   = { path = "../mm-vmm" }
devfs = { path = "../devfs" }
nscg  = { path = "../nscg" }
sysfs = { path = "../sysfs" }
cgroup = { path = "../cgroup" }
kmacros = { path = "../../shared/kmacros" }

[features]
default = []
hosted  = []

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }
