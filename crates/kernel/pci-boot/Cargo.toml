[package]
name = "pci-boot"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
klog    = { path = "../../shared/klog" }
kmacros = { path = "../../shared/kmacros" }
sync    = { path = "../../shared/sync" }
hal     = { path = "../../arch/hal" }
pmm     = { path = "../mm-pmm" }
mmio-map = { path = "../mmio-map" }
pci     = { path = "../../drivers/pci" }
virtio  = { path = "../../drivers/virtio" }
drv     = { path = "../../drivers/drv" }
arch-irq = { path = "../arch-irq" }
softirq = { path = "../softirq" }
net     = { path = "../net" }
netlink = { path = "../netlink" }
firmware = { path = "../firmware" }
drv-virtio-net   = { path = "../../drivers/drv-virtio-net" }
drv-virtio-blk   = { path = "../../drivers/drv-virtio-blk" }
drv-virtio-gpu   = { path = "../../drivers/drv-virtio-gpu" }
drv-virtio-input = { path = "../../drivers/drv-virtio-input" }
drv-virtio-rng   = { path = "../../drivers/drv-virtio-rng" }
drv-virtio-vsock = { path = "../../drivers/drv-virtio-vsock" }
drv-virtio-snd   = { path = "../../drivers/drv-virtio-snd" }
drv-nvme         = { path = "../../drivers/drv-nvme" }
drv-ahci         = { path = "../../drivers/drv-ahci" }
block            = { path = "../block" }
devfs   = { path = "../devfs" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[features]
debug-boot  = ["kmacros/debug-boot", "drv-nvme/debug-boot", "drv-ahci/debug-boot", "drv-virtio-input/debug-boot", "drv-virtio-blk/debug-boot"]
debug-trace = ["kmacros/debug-trace"]
