[package]
name = "sched"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal  = { path = "../../arch/hal" }
klog = { path = "../../shared/klog" }
sync = { path = "../../shared/sync" }
vfs  = { path = "../../kernel/vfs" }
cgroup = { path = "../cgroup" }
timer = { path = "../timer" }
softirq = { path = "../softirq" }
vmm  = { path = "../../kernel/mm-vmm" }
syscall = { path = "../syscall" }
uaccess = { path = "../uaccess" }
network-namespace = { path = "../network-namespace" }
namespace-identity = { path = "../namespace-identity" }
time-namespace = { path = "../time-namespace" }
timekeeper = { path = "../timekeeper" }

# kthread coroutine smoke needs the per-arch Context concrete type
# (52a B-0 staging — once the schedule() wiring also moves into
# this crate, the rest of kernel/src/sched/ folds in alongside).
[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[dependencies.cpu]
path = "../cpu"

[features]
default = []
hosted  = []
# Per `04§3` R06 — gates the kthread coroutine boot smoke. Kernel
# forwards via `--features debug-sched`.
debug-sched = []
debug-syscall = []
debug-gnome-syscall = []
# Wake→run latency + LAPIC tick-period probe for the gnome desktop wakeup-
# latency hunt. Threshold-gated ([WLLAT]/[WLBLK]/[WLTICK]/[WLTICKGAP]/
# [WLSCANGAP]) — emits nothing unless a stall crosses the threshold, so
# steady-state timing is unperturbed. Default-off; stays in-tree.
debug-wakelat = []
# Liveness diagnostics (`05`/`27`): one-shot soft-lockup watchdog banner +
# serial-sysrq task dump. Emits zero bytes unless a stall fires or sysrq is
# triggered — no steady-state trace noise, so timing is unperturbed.
debug-watchdog = []
debug-getdents = []
debug-syscall-return = []
debug-taskdump = ["debug-watchdog"]  # [sysrq]-style periodic all-task dump (state/last-syscall/futex/exe) every 20s — catches a single wedged task (e.g. hung udev-worker) while the system otherwise progresses
debug-polktrace = []  # [POL] live per-syscall (nr/ret) stream for polkitd only — locate the authority-init stall before RequestName
# F205 SSH-relay diagnostic — toggled from kernel/Cargo.toml's
# `debug-ssh` feature which forwards via `--features debug-ssh`.
debug-ssh = []
# Capture-first SMP wake-path probe: klogs a [SMP-STALL] banner (lock class
# rank + spin iters + cpu) when a Spinlock spins past threshold, so a -smp
# boot that still wedges names the contended lock. Prod-inert; off by default.
debug-smp = ["sync/debug-smp"]
# Task-owned FP/SIMD buffer provenance. Off by default; validates the boxed
# buffer identity before scheduler/ptrace raw FP state access.
debug-task-fpu-provenance = []
