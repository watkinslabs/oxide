[package]
name = "efence"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[features]
# Off by default: the arena is a UAF-writer localizer, not shipped. kmain's
# `debug-efence` selects it; `init()` is a no-op unless the feature is on.
default = []
debug-efence = ["kalloc/debug-efence"]
hosted = []

[dependencies]
kalloc = { path = "../../shared/kalloc" }
pmm    = { path = "../mm-pmm" }
hal    = { path = "../../arch/hal" }
klog   = { path = "../../shared/klog" }
sync   = { path = "../../shared/sync" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }
