[package]
name = "vmm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal       = { path = "../../arch/hal" }
klog      = { path = "../../shared/klog" }
sync      = { path = "../../shared/sync" }
bitflags  = { version = "2", default-features = false }

[features]
default = []
hosted  = []
debug-mount = []  # [mnt] FFAULT-LOCK: log libc lock-page VA on File-fault (correlate with zap tracer)


debug-no-cow-fast = []  # TEST: disable COW in-place fast-path (always slow-copy) to isolate write-while-shared corruption

debug-no-fork-shared = []  # TEST: force COW for all VMAs on fork

debug-no-shmem = []  # TEST: disable MAP_SHARED shared_frame path

debug-cow = []  # [COW-CORRUPT] runtime detector: checksum RO-shared anon frames at fork_cow, re-verify at COW write-fault + at free (catch peer write to a RO-shared page = stale TLB / wrong frame)
