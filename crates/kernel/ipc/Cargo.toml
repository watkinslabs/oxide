[package]
name = "ipc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal     = { path = "../../arch/hal" }
klog    = { path = "../../shared/klog" }
sync    = { path = "../../shared/sync" }
sched   = { path = "../../kernel/sched" }
namespace-identity = { path = "../../kernel/namespace-identity" }
syscall = { path = "../../kernel/syscall" }
vmm     = { path = "../../kernel/mm-vmm" }
devfs   = { path = "../../kernel/devfs" }
vfs     = { path = "../../kernel/vfs" }
timekeeper = { path = "../../kernel/timekeeper" }

# Arch MMU for shared-futex physical-page keying (translate user va->pa under
# the active CR3). cfg-gated per arch, mirroring syscalls/027_mincore.
[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }
[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[features]
debug-boot = []  # operational-pulse trace (futex park probe)
default = []
hosted  = []
debug-mount = []  # [mnt] FUTEXWAIT backing probe (diagnose the stuck-lock wedge)
debug-futextrace = []  # [FTX-WAIT]/[FTX-WAKE] per-op futex trace (uaddr/val/woken) filtered to gdm-session-worker — diagnose the greeter pthread deadlock
debug-displaystack = []  # [futex park] per-op display-stack bring-up trace; OFF by default (was under debug-boot, too noisy)
