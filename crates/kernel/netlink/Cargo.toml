[package]
name    = "netlink"
version = "0.1.0"
edition = "2021"
description = "Netlink protocol family (AF_NETLINK) per `25§7` — kernel-side message dispatch + socket type. NETLINK_ROUTE and NETLINK_GENERIC live here; family-specific handlers (rtnetlink, genetlink, nftables) plug in via the handler registry."

[lib]
path = "src/lib.rs"

[dependencies]
sync = { path = "../../shared/sync" }
vfs  = { path = "../vfs" }
net  = { path = "../net" }
sched = { path = "../sched" }
network-namespace = { path = "../network-namespace" }
namespace-identity = { path = "../namespace-identity" }
syscall = { path = "../syscall" }
security = { path = "../security" }
klog = { path = "../../shared/klog", optional = true }

[features]
debug-uevent = ["dep:klog"]
debug-netlink = ["dep:klog"]  # [NL-RX] receive-arm, multicast-overrun, and sk_err wake trace

[dev-dependencies]
net = { path = "../net", features = ["hosted"] }

[target.'cfg(target_os = "oxide-kernel")'.dependencies]
nscg = { path = "../nscg" }
