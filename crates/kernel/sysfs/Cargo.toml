[package]
name = "sysfs"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
path = "src/lib.rs"
[dependencies]
vfs    = { path = "../vfs" }
kernfs = { path = "../kernfs" }
sync   = { path = "../../shared/sync" }
net   = { path = "../net" }
block = { path = "../block" }
netlink = { path = "../netlink" }
network-namespace = { path = "../network-namespace" }
drv   = { path = "../../drivers/drv" }
pci   = { path = "../../drivers/pci" }
cpu   = { path = "../cpu" }
namespace-identity = { path = "../namespace-identity" }
drm   = { path = "../../drivers/drm" }
input = { path = "../input" }
backlight = { path = "../backlight" }
power-supply = { path = "../power-supply" }
thermal = { path = "../thermal" }
cpufreq = { path = "../cpufreq" }
cpuidle = { path = "../cpuidle" }
timekeeper = { path = "../timekeeper" }
modules = { path = "../modules" }
firmware = { path = "../firmware" }
fdt = { path = "../../shared/fdt", features = ["alloc"] }
klog = { path = "../../shared/klog" }
kalloc = { path = "../../shared/kalloc" }
hal  = { path = "../../arch/hal" }
pmm  = { path = "../mm-pmm" }
drv-zram = { path = "../../drivers/drv-zram" }
sched = { path = "../sched" }
cmdline = { path = "../cmdline" }
tty = { path = "../tty" }
# `/sys/kernel/kexec_*` report the two image slots and the reserved crash region
# the load and panic paths themselves use.
kexec = { path = "../kexec" }
power = { path = "../power" }
security = { path = "../security" }

[dev-dependencies]
fdt = { path = "../../shared/fdt", features = ["alloc", "fixture"] }
drv-zram = { path = "../../drivers/drv-zram", features = ["hosted"] }

[features]
default = []
hosted = ["modules/hosted"]
debug-udevdb = []
debug-zram = []
debug-zram-lifecycle = ["drv-zram/debug-zram-lifecycle"]
debug-displaystack = []  # [VT-POLL] tty0/active notification and read trace

[lints]
workspace = true
