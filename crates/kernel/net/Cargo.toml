[package]
name = "net"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
landlock = { path = "../landlock" }
timer = { path = "../timer" }
hal      = { path = "../../arch/hal" }
klog     = { path = "../../shared/klog" }
sync     = { path = "../../shared/sync" }
bitflags = { version = "2", default-features = false }
vfs      = { path = "../vfs" }
syscall  = { path = "../syscall" }
# F125: net calls sched::live::notify_epoll_waiters() after any
# UnixPair/UnixDgram state change so epoll_wait parkers wake.
sched    = { path = "../sched" }
network-namespace = { path = "../network-namespace" }
namespace-identity = { path = "../namespace-identity" }
softirq  = { path = "../softirq" }
cpu      = { path = "../cpu" }
pmm      = { path = "../mm-pmm" }
security = { path = "../security" }
cgroup   = { path = "../cgroup" }
crng     = { path = "../crng" }
siphash  = { path = "../../shared/siphash" }
nscg = { path = "../nscg" }

[dev-dependencies]
loom = "0.7.2"
# `sched::preempt::this_cpu()` only hands each OS thread its own simulated
# per-CPU slot under `any(test, feature = "hosted")` (B1415). `cargo test -p
# net` builds `sched` as a plain non-test dependency, so without this the
# whole hosted suite collapses onto slot 0 and one test's softirq-context
# simulation makes every concurrently running test read `in_interrupt() ==
# true` — the `sock_rtnl_defer` / packet-membership flake class (B1653).
sched = { path = "../sched", features = ["hosted"] }
# `sync/hosted` makes `spin_relax::relax()` yield instead of pure-pausing:
# hosted tests oversubscribe cores, so a descheduled `Spinlock` holder
# otherwise livelocks every waiter at 100% CPU each (B1653).
sync = { path = "../../shared/sync", features = ["hosted"] }


# F159: TCP retx scanner needs monotonic_ns. Per-arch HAL only links
# in for the matching kernel target; hosted tests skip the call site
# via `target_os = "oxide-kernel"`.
[target.'cfg(all(target_os = "oxide-kernel", target_arch = "x86_64"))'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64", package = "hal-x86_64" }
[target.'cfg(all(target_os = "oxide-kernel", target_arch = "aarch64"))'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64", package = "hal-aarch64" }

[features]
default = []
hosted  = ["sched/hosted"]
debug-tcprx = []  # [TCPRX] TCP delivery wake trace — did the receiver publish itself before the peer's bytes landed?
debug-boot = []
debug-journal = []  # [B288 dgram] FULL journald record (every FIELD=value). debug-boot keeps only the MESSAGE= line — that one carries boot-smoke's marker; the other ~13 fields per record are machine metadata
debug-scmfd = []  # [SCMW]/[SCMR] AF_UNIX SOCK_STREAM SCM_RIGHTS send/recv probe (vpid+nfds) — trace dbus-broker two-hop fd relay (logind CreateSessionWithPIDFD)
debug-syscost = []  # [UXWRITE] connected-socket write trace for polkit<->dbus-broker reply-delivery hunt
debug-dbus = []  # [DBUS] dump AF_UNIX stream messages touching login1 session iface / D-Bus errors — mutter get_session_proxy failure hunt
debug-dbus-verbose = ["debug-dbus"]  # retain the complete broker-frame stream; debug-dbus itself stays focused on login/session traffic

[lints]
workspace = true
