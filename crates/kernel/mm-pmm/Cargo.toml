[package]
name = "pmm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal      = { path = "../../arch/hal" }
klog     = { path = "../../shared/klog" }
sync     = { path = "../../shared/sync" }
bitflags = { version = "2", default-features = false }
block    = { path = "../block" }
boot-info = { path = "../../shared/boot-info" }
vmm       = { path = "../mm-vmm" }
cgroup    = { path = "../cgroup" }

[dev-dependencies]
proptest = "1"
drv-zram = { path = "../../drivers/drv-zram" }

[dependencies.sched]
path = "../sched"

[dependencies.cpu]
path = "../cpu"

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[dependencies.syscall]
path = "../syscall"

[features]
debug-pmm = []
default = []
debug-vmm = []
debug-irq = []
debug-boot = []
debug-mount = []  # [mnt] ZAP tracer: log MADV_DONTNEED/munmap ranges (diagnose spurious lock-page zap)
debug-noreclaim = []  # DIAG: never return frames to the buddy (leak) — confirms free-while-mapped aliasing
debug-fwm = []  # DIAG backstop: cross-AS peer-scan at as_teardown/munmap that repairs an under-counted frame a peer AS still maps ([FWM-REPAIR]/[FWM-EVICT]). Opt-in — the always-on invariant is release_frame_on_zero's own-mapcount check; the scan is O(pages*ASes) per exit
debug-leak-teardown = []  # BISECT: leak only as_teardown frees (vs munmap/COW) to locate the premature free
debug-cow = ["vmm/debug-cow"]  # runtime COW-corruption detector: 0xCC poison-on-free + [POISON] dirtied-while-free at alloc, [COW-LEAK] refcount/mapcount==live-PTE assert at free, vmm-side [COW-CORRUPT] checksum re-verify
debug-atexit = ["vmm/debug-atexit"]  # loader-corruption probes ([TAILZAP] sentinel re-verify at fault entry)
