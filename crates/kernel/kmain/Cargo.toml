[package]
name = "kmain"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "kmain"
path = "src/kmain.rs"

[dependencies]
block   = { path = "../block" }
boot-info = { path = "../../shared/boot-info" }
cpu       = { path = "../cpu" }
devfs     = { path = "../devfs" }
elf-load  = { path = "../exec" }
arch-irq  = { path = "../arch-irq" }
ipc       = { path = "../ipc" }
elf     = { path = "../../shared/elf" }
net     = { path = "../net" }
modules = { path = "../modules" }
pci     = { path = "../../drivers/pci" }
virtio  = { path = "../../drivers/virtio" }
ext4    = { path = "../ext4" }
hal     = { path = "../../arch/hal" }
klog    = { path = "../../shared/klog" }
console   = { path = "../console" }
cmdline   = { path = "../cmdline" }
smoke     = { path = "../smoke" }
timer     = { path = "../timer" }
sysfs     = { path = "../sysfs" }
syscalls  = { path = "../syscalls" }
pci-boot  = { path = "../pci-boot" }
devpts    = { path = "../devpts" }
tracefs   = { path = "../tracefs" }
kmacros   = { path = "../../shared/kmacros" }
kalloc  = { path = "../../shared/kalloc" }
pmm     = { path = "../mm-pmm" }
procfs  = { path = "../procfs" }
sched   = { path = "../sched" }
softirq = { path = "../softirq" }
netlink = { path = "../netlink" }
netfilter = { path = "../netfilter" }
sync    = { path = "../../shared/sync" }
syscall = { path = "../syscall" }
tty     = { path = "../tty" }
vfs     = { path = "../vfs" }
fs      = { path = "../fs" }
vmm     = { path = "../mm-vmm" }
power    = { path = "../power" }
firmware = { path = "../firmware" }
nscg     = { path = "../nscg" }
cgroup   = { path = "../cgroup" }
security = { path = "../security" }
drv             = { path = "../../drivers/drv" }
drv-virtio-gpu    = { path = "../../drivers/drv-virtio-gpu" }
drv-virtio-input  = { path = "../../drivers/drv-virtio-input" }
drv-virtio-net    = { path = "../../drivers/drv-virtio-net" }
drv-virtio-blk    = { path = "../../drivers/drv-virtio-blk" }
drv-virtio-rng    = { path = "../../drivers/drv-virtio-rng" }
drv-virtio-vsock  = { path = "../../drivers/drv-virtio-vsock" }
drv-virtio-snd    = { path = "../../drivers/drv-virtio-snd" }
sound             = { path = "../sound" }
drv-serial        = { path = "../../drivers/drv-serial" }
drv-ps2-keyboard  = { path = "../../drivers/drv-ps2-keyboard" }
drv-zram          = { path = "../../drivers/drv-zram" }
drm               = { path = "../../drivers/drm" }
fbdev             = { path = "../../drivers/fbdev" }
fbcon             = { path = "../../drivers/fbcon" }
vt                = { path = "../../drivers/vt" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[features]
default = []
# Per `docs/04§3` (rev R05): per-subsystem debug features. Off = call
# sites absent from the binary; the hot path emits zero bytes. Names
# match the spec's bucket list 1:1 — independence guarantee in §3.
debug-pmm  = ["kmacros/debug-pmm", "smoke/debug-pmm", "pmm/debug-pmm"]  # PMM smoke + stress + memmap dump
debug-memtest = ["smoke/debug-memtest"]  # in-guest full-RAM memtest pass (opt-in; slow under TCG)
debug-vmm  = ["pmm/debug-vmm", "kmacros/debug-vmm", "smoke/debug-vmm"]  # device-map MMIO sanity reads (HPET cap, GICD typer)
debug-irq  = ["pmm/debug-irq", "kmacros/debug-irq", "smoke/debug-irq"]  # LAPIC/GIC enable diag + timer-IRQ soak + tick logs
debug-acpi = ["firmware/debug-acpi", "kmacros/debug-acpi", "smoke/debug-acpi"]  # forwarded; impl in crates/firmware
debug-sched = ["sched/debug-sched","fs/debug-sched", "kmacros/debug-sched", "smoke/debug-sched"]  # first-kthread coroutine smoke + Context::switch trace
debug-smp = ["sched/debug-smp", "sync/debug-smp"]  # spin-stall probe: names the lock CLASS rank of any Spinlock::lock() that spins past SPIN_WARN_ITERS (busy-spin livelock hunt)
debug-boot = ["ipc/debug-boot", "fs/debug-boot", "pmm/debug-boot", "drv-virtio-gpu/debug-boot", "drv-virtio-blk/debug-boot", "devfs/debug-boot", "kmacros/debug-boot", "devpts/debug-boot", "smoke/debug-boot", "elf-load/debug-boot", "syscalls/debug-boot", "pci-boot/debug-boot", "drv-ps2-keyboard/debug-boot", "sysfs/debug-zram"]  # operational-pulse trace (init started, pmm: ready, …)
debug-zram = ["tracefs/zram-memory-tracking"]  # retained CONFIG_ZRAM_MEMORY_TRACKING-equivalent block_state debugfs ABI
debug-zram-lifecycle = ["syscalls/debug-zram-lifecycle"]  # [ZRAM-TEST] executable-scoped lifecycle conformance trace
debug-cgroup = ["cgroup/debug-cgroup", "kmacros/debug-cgroup", "syscalls/debug-cgroup", "procfs/debug-cgroup"]  # cgroup v2 boot self-test + per-cgroup charge/uncharge trace (26§10)
debug-modules = []  # kmod thunk write_raw / kassert traces
debug-syscall = ["sched/debug-syscall", "kmacros/debug-syscall", "syscalls/debug-syscall"]  # per-syscall trace (proc/wait/futex + PAM keyring/ns/cred set + any EPERM return [RETERR])
debug-swap = ["syscalls/debug-swap", "vmm/debug-swap"]  # narrow retained swap + address-space activation trace
debug-random-seed = ["syscalls/debug-random-seed"]  # [RSEED] executable-scoped systemd-random-seed syscall trace
debug-gnome-syscall = ["syscalls/debug-gnome-syscall"]  # complete bounded syscall trace for gnome-shell only
debug-scmfd = ["net/debug-scmfd", "syscalls/debug-scmfd"]  # [SCMW]/[SCMR] AF_UNIX stream SCM_RIGHTS fd-relay probe — trace dbus-broker two-hop pidfd/session_fd relay (logind CreateSessionWithPIDFD)
debug-dbus = ["net/debug-dbus", "syscalls/debug-dbus"]  # [DBUS] login1 session-proxy D-Bus wire trace (mutter "no matching session" hunt)
debug-wakelat = ["sched/debug-wakelat", "arch-irq/debug-wakelat", "fs/debug-wakelat", "syscalls/debug-wakelat", "ext4/debug-wakelat"]  # wake→run latency + LAPIC tick-period probe ([WLLAT]/[WLBLK]/[WLTICK]/[WLTICKGAP]/[WLSCANGAP]) — gnome desktop wakeup-latency hunt
debug-fsync-latency = ["ext4/debug-fsync-latency"]  # [EXT4-FSYNC] systemd-hwdb durability-path latency probe
debug-heappoison = ["kalloc/debug-heappoison"]  # poison+quarantine freed heap blocks; #UD/oops handler prints [UAF] reg/base/size — localizes the gnome refcount-corruption UAF
debug-openat = ["syscalls/debug-openat"]  # verbose [OPENAT] path log (split from debug-syscall)
debug-eacces = ["syscalls/debug-eacces", "vfs/debug-eacces"]  # [EACCES] DAC-denial path+creds+owner/mode probe (login-frontier permission hunt)
debug-stderr = ["syscalls/debug-stderr"]  # [STDERR] echo userspace fd==2 writes to console — gnome-shell/mutter death-message visibility (lightweight, normal boot speed)
debug-session = ["syscalls/debug-session"]  # [SESSFILE] logind session-state file-write visibility (session classification / DISPLAY= — "no matching session" hunt)
debug-uevent = ["syscalls/debug-uevent", "netlink/debug-uevent"]  # [UEV-*] udev-monitor delivery trace: subscription + kernel emit recipient count + cooked-uevent unicast(worker→manager)/broadcast(manager→group2) — gdm greeter re-notify hunt (G9)
debug-udevdb = ["syscalls/debug-udevdb", "sysfs/debug-udevdb"]  # [UDEVDB] udev runtime database/tag syscall trace for seat DB materialization
debug-watchdog = ["sched/debug-watchdog"]  # liveness watchdog soft-lockup banner + serial-sysrq task dump (05/27); one-shot/on-demand, no steady-state noise
debug-taskdump = ["sched/debug-taskdump"]  # [TASKDUMP] periodic all-task state/last-syscall/futex/exe dump every 20s — catches a single wedged task while the system otherwise progresses (hung udev-worker → card0 → gdm greeter hunt)
debug-polktrace = ["sched/debug-polktrace"]  # [POL] live per-syscall nr/ret stream for polkitd — authority-init stall hunt
debug-syscost = ["syscalls/debug-syscost", "fs/debug-syscost", "net/debug-syscost"]  # [SYSCOST] per-syscall profiler + [ETSUP]/[EPADD]/[LSCAN] dbus-broker epoll diagnostics
debug-fdlife = ["syscalls/debug-fdlife", "fs/debug-fdlife"]  # [FDLIFE]/[EPBADF] socket-activation descriptor ownership trace
debug-ssh = ["sched/debug-ssh","fs/debug-ssh", "kmacros/debug-ssh", "syscalls/debug-ssh"]  # F205: targeted trace inside select/wait4/exit/signal-child for SSH-relay diagnostics — much narrower than debug-sched, won't flood PL011
debug-sshd = ["syscalls/debug-sshd"]  # [SSHD] executable-scoped syscall trace; preserves PID 1 startup timing
debug-reap = ["sched/debug-ssh"]  # ONLY the sched-crate reap traces (signal_child_exit + wake_wait4_parent) — NO per-syscall flood. Console-zombie debugging.
debug-epoll = ["fs/debug-epoll"]  # [epoll-lvl] level-triggered readiness trace — diagnose systemd "Looping too fast" busy-loops.
debug-mount = ["pmm/debug-mount", "vmm/debug-mount", "ipc/debug-mount"]  # TEMP: WROTE-LOCK rip — lock page RO so first write traps + logs the corruptor's RIP. ipc → [mnt] FUTEXWAIT stuck-lock probe.
debug-mnt = ["syscalls/debug-mount", "vfs/debug-mnt", "procfs/debug-mnt"]  # mount-family syscall failure trace + [MNTCREATE] vfs mount-create trace + [MNTINFO] procfs reader trace
debug-futextrace = ["ipc/debug-futextrace"]  # [FTX-WAIT]/[FTX-WAKE] futex ops (uaddr/val/woke) for gdm-session-worker — greeter pthread-deadlock hunt
debug-displaystack = ["ipc/debug-displaystack", "pmm/debug-displaystack", "sched/debug-displaystack", "syscalls/debug-displaystack"]  # [futex park]/[VTIO]/[TGKILL]/[waitid]/[FAULT-ARM-CTX] per-op display-stack traces (opt-in)
debug-noreclaim = ["pmm/debug-noreclaim"]  # DIAG: leak freed frames — confirm free-while-mapped aliasing is the wedge.
debug-fwm = ["pmm/debug-fwm"]  # DIAG: [FWM] pinpoint the free-while-mapped caller at as_teardown.
debug-leak-teardown = ["pmm/debug-leak-teardown"]  # BISECT premature-free path
debug-cow = ["pmm/debug-cow", "vmm/debug-cow"]  # runtime COW-corruption detector ([COW-CORRUPT]/[COW-LEAK]/[COW-RC]/[POISON]) — checksum RO-shared anon frames, poison freed frames, assert refcount==live-PTE
debug-fillverify = ["ext4/debug-fillverify"]  # ext4 page-cache integrity ([FILLRACE]/[FRAME-CORRUPT])
debug-no-cow-fast = ["vmm/debug-no-cow-fast"]  # TEST: disable COW fast-path
debug-no-fork-shared = ["vmm/debug-no-fork-shared"]  # TEST
debug-no-shmem = ["vmm/debug-no-shmem"]  # TEST
debug-shortfill = ["vmm/debug-shortfill"]  # [SHORT-FILE-FAULT] B240: log File demand-fault short read_at on a non-EOF page (partial fill = ld.so exit 127)
debug-eager-fork = ["syscalls/debug-eager-fork"]  # TEST
debug-atexit = ["syscalls/debug-atexit", "vmm/debug-atexit", "pmm/debug-atexit", "hal/debug-zerotrap"]  # targeted dynamic-loader stderr / atexit probes
debug-trace = ["kmacros/debug-trace", "console/debug-trace", "smoke/debug-trace", "syscalls/debug-trace", "pci-boot/debug-trace"]  # structured dtrace! probes — direct UART emit bypassing klog/lock (CAT-wedge-class debugging)
debug-all  = ["debug-pmm","debug-vmm","debug-irq","debug-acpi","debug-sched","debug-boot","debug-cgroup","debug-modules","debug-syscall","sched/debug-syscall"]
