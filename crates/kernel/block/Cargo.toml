[package]
name = "block"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
sched  = { path = "../sched" }
softirq = { path = "../softirq" }
cgroup = { path = "../cgroup" }
hal      = { path = "../../arch/hal" }
klog     = { path = "../../shared/klog" }
sync     = { path = "../../shared/sync" }
# device-model Stage C (D27): registering a disk also `drv::device_add`s a
# block /dev node so /dev/<disk> + /sys/block derive from one registration.
# drv deps {hal,klog,sync,vfs} only — acyclic with block.
drv      = { path = "../../drivers/drv" }
# blkdev open bridge (devbridge.rs): publish each disk into the VFS BLKDEV
# dispatch table so `open("/dev/<disk>")` resolves. vfs is no_std + depends on
# neither block nor drv (acyclic), same edge drv already uses.
vfs      = { path = "../../kernel/vfs" }
bitflags = { version = "2", default-features = false }

[features]
default = []
hosted  = []

[lints]
workspace = true
