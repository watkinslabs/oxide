[package]
name = "block"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
sched  = { path = "../sched" }
softirq = { path = "../softirq" }
cgroup = { path = "../cgroup" }
hal      = { path = "../../arch/hal" }
klog     = { path = "../../shared/klog" }
sync     = { path = "../../shared/sync" }
# device-model Stage C (D27): registering a disk also `drv::device_add`s a
# block /dev node so /dev/<disk> + /sys/block derive from one registration.
# drv deps {hal,klog,sync,vfs} only — acyclic with block.
drv      = { path = "../../drivers/drv" }
# blkdev open bridge (devbridge.rs): publish each disk into the VFS BLKDEV
# dispatch table so `open("/dev/<disk>")` resolves. vfs is no_std + depends on
# neither block nor drv (acyclic), same edge drv already uses.
vfs      = { path = "../../kernel/vfs" }
bitflags = { version = "2", default-features = false }
crc      = { path = "../../shared/crc" }
# Inline encryption (blk-crypto): the software fallback performs the same
# constructions a controller would, so the block layer needs the ciphers
# directly rather than through any filesystem.
crypt    = { path = "../../shared/crypt" }
aes      = { path = "../../shared/aes" }
sm4      = { path = "../../shared/sm4" }
adiantum = { path = "../../shared/adiantum" }

[features]
default = []
hosted  = ["sched/hosted"]

# Non-kernel builds exercise the same sleeping lifecycle lock as the running
# kernel.  Registry publication and VFS open/close are process-context work;
# a spinlock model would hide scheduling-while-atomic regressions.
[target.'cfg(not(target_os = "oxide-kernel"))'.dependencies]
sched = { path = "../sched", features = ["hosted"] }

# kflushd's park deadline and the age a dirty mapping is measured by. Only the
# kernel build has a thread to park; a hosted test drives the writeback pass
# directly and supplies its own clock through `pagecache::install_clock`.
[target.'cfg(target_os = "oxide-kernel")'.dependencies]
timekeeper = { path = "../timekeeper" }

[lints]
workspace = true
