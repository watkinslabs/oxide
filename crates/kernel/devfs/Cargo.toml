[package]
name = "devfs"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"

# Devfs registry per `52§3` domain layer. Owns the namespace-aware
# (ns, path) → InodeRef table; the boot-time bootstrap that fills
# it with kernel-side device implementations stays in
# `kernel/src/devfs.rs` per `52§5` (integration in kernel).

[dependencies]
hal    = { path = "../../arch/hal" }
sync   = { path = "../../shared/sync" }
vfs    = { path = "../../kernel/vfs" }
klog   = { path = "../../shared/klog" }
kernfs = { path = "../kernfs" }
# device-model Stage C (D27): the built-in mem pseudo-devices self-register via
# `drv::device_add` so ONE registration drives /dev (+ /sys when a bus matches).
# drv deps {hal,klog,sync,vfs} only — no drv->devfs edge, so this is acyclic.
drv    = { path = "../../drivers/drv" }

[features]
default = []
debug-boot = []

[dev-dependencies]
drv-zram = { path = "../../drivers/drv-zram", features = ["hosted"] }
