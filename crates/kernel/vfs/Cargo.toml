[package]
name = "vfs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal      = { path = "../../arch/hal" }
klog     = { path = "../../shared/klog" }
sync     = { path = "../../shared/sync" }
bitflags = { version = "2", default-features = false }
namespace-identity = { path = "../namespace-identity" }
vmm      = { path = "../mm-vmm" }

[features]
default = []
hosted  = []
# TEMP (D24 diagnostics, prod-inert): [MNTCREATE] trace at every Mount
# create/attach/clone/graft site (mount.rs) + mount-family syscalls — reconstruct
# how systemd builds the sandbox-root mounts (mnt_id 10/11); AND [MNTDIVERGE]
# probe in `follow_mount_down` (namei.rs) comparing the legacy `mounted_mount(ns)`
# walk source vs the strict `__lookup_mnt(cur_mnt,d)` at every real-boot crossing
# (verdict OK/GAP) — the D24 Stage-1b flip gate. Off ⇒ zero hot-path bytes.
debug-mnt = []
# [EACCES] DAC-denial probe in generic_permission: logs inode ino/uid/gid/mode +
# requested mask + caller uid/gid at every EACCES return (login-frontier
# permission hunt). Off => zero hot-path bytes.
debug-eacces = []
debug-fdlife = []
debug-getdents = []
