[package]
name = "tty"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal  = { path = "../../arch/hal" }
klog = { path = "../../shared/klog" }
sched = { path = "../sched" }
sync  = { path = "../../shared/sync" }
vfs   = { path = "../vfs" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[features]
default = []
# Expose host-only test helpers (e.g. `wait::host::HostWait`) to
# downstream crates' tests (vtconsole T5 integration harness).
hosted = []

[dev-dependencies]
proptest = "1"
