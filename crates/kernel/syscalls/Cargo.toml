[package]
name = "syscalls"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
block   = { path = "../block" }
boot-info = { path = "../../shared/boot-info" }
cpu       = { path = "../cpu" }
devfs     = { path = "../devfs" }
elf-load  = { path = "../exec" }
arch-irq  = { path = "../arch-irq" }
ipc       = { path = "../ipc" }
elf     = { path = "../../shared/elf" }
net     = { path = "../net" }
modules = { path = "../modules" }
pci     = { path = "../../drivers/pci" }
virtio  = { path = "../../drivers/virtio" }
ext4    = { path = "../ext4" }
hal     = { path = "../../arch/hal" }
klog    = { path = "../../shared/klog" }
console   = { path = "../console" }
smoke     = { path = "../smoke" }
devpts    = { path = "../devpts" }
tracefs   = { path = "../tracefs" }
kernfs    = { path = "../kernfs" }
kmacros   = { path = "../../shared/kmacros" }
kalloc  = { path = "../../shared/kalloc" }
pmm     = { path = "../mm-pmm" }
procfs  = { path = "../procfs" }
sysfs   = { path = "../sysfs" }
sched   = { path = "../sched" }
pidfd   = { path = "../pidfd" }
socket  = { path = "../socket" }
softirq = { path = "../softirq" }
netlink = { path = "../netlink" }
netfilter = { path = "../netfilter" }
sync    = { path = "../../shared/sync" }
syscall = { path = "../syscall" }
timekeeper = { path = "../timekeeper" }
uaccess = { path = "../uaccess" }
tty     = { path = "../tty" }
vfs     = { path = "../vfs" }
fs      = { path = "../fs" }
vmm     = { path = "../mm-vmm" }
power    = { path = "../power" }
firmware = { path = "../firmware" }
nscg     = { path = "../nscg" }
namespace-identity = { path = "../namespace-identity" }
network-namespace = { path = "../network-namespace" }
cgroup   = { path = "../cgroup" }
security = { path = "../security" }
drv             = { path = "../../drivers/drv" }
drv-virtio-gpu    = { path = "../../drivers/drv-virtio-gpu" }
drv-virtio-input  = { path = "../../drivers/drv-virtio-input" }
drv-virtio-net    = { path = "../../drivers/drv-virtio-net" }
drm               = { path = "../../drivers/drm" }
fbdev             = { path = "../../drivers/fbdev" }
fbcon             = { path = "../../drivers/fbcon" }
vt                = { path = "../../drivers/vt" }
sound             = { path = "../sound" }
drv-virtio-snd    = { path = "../../drivers/drv-virtio-snd" }

[dev-dependencies]
net = { path = "../net", features = ["hosted"] }

[features]
debug-eager-fork = []  # TEST: eager-copy fork instead of COW
debug-boot = ["kmacros/debug-boot", "net/debug-boot", "drm/debug-boot"]
debug-displaystack = []  # [VTIO]/[TGKILL]/[waitid] per-op display-stack bring-up traces; OFF by default (were under debug-boot / ungated, too noisy)
debug-trace = ["kmacros/debug-trace"]
debug-syscall = ["kmacros/debug-syscall", "sched/debug-syscall"]
debug-smp = []  # targeted ARM SVC return-frame diagnostics
debug-syscost = []  # [SYSCOST] non-distorting per-syscall cumulative wall-time profiler for polkitd (top-N every 8192 calls)
debug-fdlife = ["vfs/debug-fdlife"]  # [FDHIST] low-distortion socket-activation fd history
debug-scmfd = ["net/debug-scmfd"]  # [SCMW]/[SCMR] AF_UNIX stream SCM_RIGHTS fd-relay probe (dbus-broker two-hop pidfd trace)
debug-wakelat = ["sched/debug-wakelat"]  # recvmsg/poll busy-wait stall probe ([WLBLK]) + wait-kind tags for the gnome wakeup-latency hunt
debug-openat = []  # verbose per-openat path log ([OPENAT] dirfd/flags/path) — split from debug-syscall so syscall-trace captures aren't drowned by the openat flood
debug-ssh = ["kmacros/debug-ssh"]
debug-cgroup = ["kmacros/debug-cgroup"]
debug-mount = []  # [mnt] log of mount-family syscall failures (path+errno) — 226/NAMESPACE diagnosis
debug-atexit = []  # abandoned atexit-corruption FILEREAD/LOCKBYTE probes (kept, off)
debug-eacces = ["vfs/debug-eacces"]  # [EACCES] path+creds+owner/mode log at every openat -13 return (login-frontier permission hunt)
debug-stderr = []  # [STDERR] echo fd==2 write(2)/writev(2) to console (lightweight; gnome-shell/mutter death-message visibility) — no ld.so DR0 machinery, boots at normal speed
debug-session = []  # [SESSFILE] echo writes to logind session-state files (/run/systemd/{sessions,users,seats}) — session classification (Type/Class/Seat/VTNr/DISPLAY) visibility for the "no matching session" hunt
debug-dbus = []  # [PEERCRED]/[GETSESSBYPID]/[OPENCG] D-Bus creds + login1 session-lookup probes (mutter "no matching session" hunt)
debug-uevent = []  # [UEV-*] NETLINK_KOBJECT_UEVENT monitor trace: bind/setsockopt group subscription + cooked-uevent send (unicast worker→manager, broadcast manager→group2) with action/devpath + reach count — gdm greeter "udev never re-notified" hunt (G9)
debug-udevdb = []  # [UDEVDB] /run/udev/data + /run/udev/tags syscall trace for seat DB materialization

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }
