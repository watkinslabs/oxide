[package]
name = "umh"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

# Kernel usermode helper: the kernel -> userspace exec primitive
# (`call_usermodehelper`). Consumers: coredump `|pipe` handlers, the
# `request_key(2)` upcall, hotplug/uevent helpers.

[dependencies]
hal     = { path = "../../arch/hal" }
klog    = { path = "../../shared/klog" }
sync    = { path = "../../shared/sync" }
syscall = { path = "../syscall" }
sched   = { path = "../sched" }
vfs     = { path = "../vfs" }
vmm     = { path = "../mm-vmm" }
pmm     = { path = "../mm-pmm" }
aslr    = { path = "../aslr" }
crng    = { path = "../crng" }
elf-load = { path = "../exec" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[features]
default = []
debug-umh = []
# `#[cfg(any(test, feature = "hosted"))] extern crate std` in src/lib.rs.
hosted = []

[lints]
workspace = true
