[package]
name = "fs"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

# Umbrella for VFS-related subsystems that need both vfs (Inode trait)
# and sched (current() / WaitList) — folded from per-subsystem sibling
# crates per `52§4` proposed layout. Submodules: pipe, epoll, signalfd,
# timerfd, inotify, userfaultfd, flock, xattr, keyring, perf.

[dependencies]
hal      = { path = "../../arch/hal" }
klog     = { path = "../../shared/klog" }
sync     = { path = "../../shared/sync" }
sched    = { path = "../sched" }
cgroup   = { path = "../cgroup" }
pmm      = { path = "../mm-pmm" }
vmm      = { path = "../mm-vmm" }
syscall  = { path = "../syscall" }
vfs      = { path = "../vfs" }
devfs    = { path = "../devfs" }
procfs   = { path = "../procfs" }
nscg     = { path = "../nscg" }

[dev-dependencies]
block = { path = "../block" }
boot-info = { path = "../../shared/boot-info" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[features]
default = []
debug-boot = []
debug-sched = []
debug-wakelat = ["sched/debug-wakelat"]  # epoll_wait busy-wait stall probe ([WLBLK]) for the gnome wakeup-latency hunt
# F205 SSH-relay diagnostic — forwarded from kernel/Cargo.toml.
debug-ssh = []
# Level-triggered epoll readiness trace ([epoll-lvl]) — busy-loop diagnosis.
debug-epoll = []
debug-syscost = []  # [ETSUP]/[EPADD]/[LSCAN] dbus-broker epoll/accept diagnostics in scan_once
debug-fdlife = ["vfs/debug-fdlife"]  # [EPBADF]/[FDHIST] identify missing epoll/listener descriptors
