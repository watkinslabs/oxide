[package]
name = "fs"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

# Umbrella for VFS-related subsystems that need both vfs (Inode trait)
# and sched (current() / WaitList) — folded from per-subsystem sibling
# crates per `52§4` proposed layout. Submodules: pipe, epoll, signalfd,
# timerfd, inotify, userfaultfd, flock, xattr, keyring, perf.

[dependencies]
hal      = { path = "../../arch/hal" }
klog     = { path = "../../shared/klog" }
sync     = { path = "../../shared/sync" }
sched    = { path = "../sched" }
cgroup   = { path = "../cgroup" }
pmm      = { path = "../mm-pmm" }
vmm      = { path = "../mm-vmm" }
syscall  = { path = "../syscall" }
vfs      = { path = "../vfs" }
devfs    = { path = "../devfs" }
procfs   = { path = "../procfs" }
nscg     = { path = "../nscg" }
umh      = { path = "../umh" }
pidfd    = { path = "../pidfd" }
timekeeper = { path = "../timekeeper" }
# `capable(CAP_SYS_PTRACE)` for userfaultfd(2) is `ns_capable(&init_user_ns, …)`,
# so the gate needs the initial-user-namespace test, not just the effective set.
namespace-identity = { path = "../namespace-identity" }
uaccess  = { path = "../uaccess" }
cpu      = { path = "../cpu" }
# Diffie-Hellman modular exponentiation and the digest table the keyring's
# key-derivation path resolves hash names against.
mpi      = { path = "../../shared/mpi" }
crypt    = { path = "../../shared/crypt" }
# Asymmetric key blobs (X.509 / PKCS#8) and the RSA operations the
# `KEYCTL_PKEY_*` family performs.
pkey     = { path = "../../shared/pkey" }
# Encryption padding must be unpredictable, so it comes from the kernel's
# random pool rather than from anything the caller can influence.
crng     = { path = "../crng" }
net      = { path = "../net" }

[dev-dependencies]
# TEMPORARY (B1659): `net` leaves `ipv4_options`, `raw4`, `send_control` and
# `sock_v6_name` ungated while they use `sock_opts`, which is
# `cfg(any(oxide-kernel, test, hosted))`. Without this, `cargo test -p fs` does
# not build at all. Drop the line once net's hosted build is whole again.
net = { path = "../net", features = ["hosted"] }
block = { path = "../block" }
boot-info = { path = "../../shared/boot-info" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[features]
default = []
debug-boot = []
debug-desktop = []  # compositor timerfd frame-clock ledger (arm/read/poll); per-op, split off debug-boot per B1474
debug-zram-lifecycle = []  # [TMPFS-MIG] owner/index/token trace for zram-driven pageout diagnosis
# Full compositor timerfd ledger.  `debug-boot` retains the monotonic
# frame-clock path, while this opt-in variant also records GLib's numerous
# realtime housekeeping timers without perturbing graphical bring-up.
debug-mutter-timer-verbose = []
debug-sched = []
debug-wakelat = ["sched/debug-wakelat"]  # epoll_wait busy-wait stall probe ([WLBLK]) for the gnome wakeup-latency hunt
# F205 SSH-relay diagnostic — forwarded from kernel/Cargo.toml.
debug-ssh = []
debug-keyring = []  # [KEYRING] construction/instantiation outcome trace for the request_key upcall
# [INOTIFY-ENOENT] per-failed-watch path trace. Its own feature, never
# debug-boot: systemd's watch churn made it the single largest source of
# default-boot log volume (1297 of 3379 lines on one capture).
debug-inotify = []
# Level-triggered epoll readiness trace ([epoll-lvl]) — busy-loop diagnosis.
debug-epoll = []
debug-displaystack = []  # [EP-NOTIFY] per-interest epoll callback trace
debug-syscost = []  # [ETSUP]/[EPADD]/[LSCAN] dbus-broker epoll/accept diagnostics in scan_once
debug-fdlife = ["vfs/debug-fdlife"]  # [EPBADF]/[FDHIST] identify missing epoll/listener descriptors
# `#[cfg(any(test, feature = "hosted"))] extern crate std` in src/lib.rs.
hosted = []
[lints]
workspace = true
