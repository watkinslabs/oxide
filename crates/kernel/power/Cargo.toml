[package]
name = "power"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal      = { path = "../../arch/hal" }
klog     = { path = "../../shared/klog" }
sync     = { path = "../../shared/sync" }
firmware = { path = "../firmware" }
# The freeze passes and the suspend-to-idle block walk the task registry and
# use the scheduler's park mechanism (`32a§8`, `32a§10`). `sched` cannot depend
# on `power` in return — that closes a cycle through `firmware`->`ext4` — so
# the walk lives here and the scheduler owns only the primitives it wraps.
sched    = { path = "../sched" }
timekeeper = { path = "../timekeeper" }
cpu      = { path = "../cpu" }
pmm      = { path = "../mm-pmm" }
boot-info = { path = "../../shared/boot-info" }
syscall  = { path = "../syscall" }
crypt    = { path = "../../shared/crypt" }
cmdline  = { path = "../cmdline" }
lz4_flex = { version = "0.14.0", default-features = false, features = ["alloc", "safe-encode", "safe-decode"] }
lzo1x    = { path = "../../shared/lzo1x" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../../arch/hal-x86_64" }
mmio-map   = { path = "../mmio-map" }

# The PSCI ABI numbers, the SYSTEM_SUSPEND admission ladder and the saved-EL1
# layout live in hal-aarch64's ungated modules, so a hosted test run needs the
# crate even on an x86 host — but a kernel build must NOT link both HALs. They
# each define the fault-print entry point, and linking the pair makes that
# symbol multiply defined, which fails the release build's LTO with an
# unhelpful "failed to load bitcode" rather than a duplicate-symbol error.
[target.'cfg(any(target_arch = "aarch64", not(target_os = "oxide-kernel")))'.dependencies]
hal-aarch64 = { path = "../../arch/hal-aarch64" }

[features]
default = []
# `32§11`: log every reboot attempt. The reset ladder's per-rung trace is the
# attempt-level detail this feature names; the reboot itself stays logged
# unconditionally by `machine::terminal`, so a production reboot is still
# visible without it.
debug-power = []
debug-hibernate = []

[lints]
workspace = true
