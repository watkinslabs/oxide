# Serial tty driver (T6 of tty-rebuild-plan). Linux's `ttyS0` `tty_driver`
# shape (serial_core layer): a `TtyDriver` whose output
# goes to the UART (`drv_serial::emit`). The console crate owns the one live
# UART RX registration and feeds this driver through its flip-buffer worker.
#
# `drv-serial` is a kernel-target-only dependency (it pulls in hal /
# arch-irq / firmware which do not build for the host); the actual UART
# emit adapter is `#[cfg(target_os = "oxide-kernel")]`
# gated. Host tests use an injected `SerialOut` sink, so this crate is
# host-testable end-to-end without a real UART. No dep cycle:
# serialtty → {tty, (oxide-kernel) drv-serial}.
[package]
name = "serialtty"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
tty = { path = "../tty" }

[target.'cfg(target_os = "oxide-kernel")'.dependencies]
drv-serial = { path = "../../drivers/drv-serial" }
# Mirror console output to the foreground framebuffer VT so /dev/console
# (getty/login/shell) shows on the display, not just the UART — the
# multi-console behavior (Linux `console=tty0 console=ttyS0`). No cycle:
# fbcon depends only on vtdata.
fbcon = { path = "../../drivers/fbcon" }

[dev-dependencies]
tty = { path = "../tty", features = ["hosted"] }
proptest = "1"

[features]
default = []
# Expose host-only assembly helpers to downstream crates' tests.
hosted = ["tty/hosted"]

[lints]
workspace = true
