[package]
name = "hal"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
klog = { path = "../../shared/klog" }
bitflags = { version = "2", default-features = false }

[features]
debug-zerotrap = []  # [ZEROTRAP] armed-frame zero-write trap (names the zeroing call site)
