[package]
name = "kernel-bin-x86_64"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "oxide-x86_64"
path = "src/main.rs"

[dependencies]
boot-x86_64 = { path = "../../arch/boot-x86_64" }
klog        = { path = "../../shared/klog" }

[features]
default     = ["debug-panic"]
debug-panic = []
debug-getdents = ["boot-x86_64/debug-getdents"]
debug-getdents-detail = ["boot-x86_64/debug-getdents-detail"]
