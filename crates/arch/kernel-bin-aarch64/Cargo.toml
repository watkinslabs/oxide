[package]
name = "kernel-bin-aarch64"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "oxide-aarch64"
path = "src/main.rs"

[dependencies]
boot-aarch64 = { path = "../../arch/boot-aarch64" }

[features]
debug-getdents = ["boot-aarch64/debug-getdents"]
debug-getdents-detail = ["boot-aarch64/debug-getdents-detail"]
debug-syscall-return = ["boot-aarch64/debug-syscall-return"]
debug-task-fpu-provenance = ["boot-aarch64/debug-task-fpu-provenance"]
