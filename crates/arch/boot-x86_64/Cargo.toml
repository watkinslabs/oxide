[package]
name = "boot-x86_64"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
boot-info = { path = "../../shared/boot-info" }
cmdline = { path = "../../kernel/cmdline" }
kmain = { path = "../../kernel/kmain" }
klog         = { path = "../../shared/klog" }
hal          = { path = "../../arch/hal" }
hal-x86_64   = { path = "../../arch/hal-x86_64" }
limine-proto = { path = "../../arch/limine-proto" }
sync         = { path = "../../shared/sync" }

[features]
# `debug-watchdog` is default-ON: the liveness watchdog + serial-sysrq
# task dump must be armed in every shipped/CI/field build to catch a
# *flaky* hang the first time it happens — a build-time opt-in would
# miss it. R06's "default builds emit zero log bytes" still holds: the
# per-tick state machine is always-on but silent; bytes are emitted only
# on an actual stall (an oops-class event, like `fatal!`) or an explicit
# sysrq. Disable with `--no-default-features` for a truly minimal build.
default    = ["debug-watchdog"]
hosted     = []
# Per `04§4.0` (R06): gates this crate's klog call sites
# (UART sink install + CPU/MMU dump) so default builds emit
# zero log bytes. Mirrors `kernel`'s `debug-boot`; xtask
# `--features debug-boot` enables both because cargo applies
# `--features` to every selected `-p` package that declares it.
debug-boot = []
# Pass-through to `hal-x86_64`'s `debug-irq`. xtask's
# `--features debug-irq|debug-all` only applies to the packages
# it selects via `-p` (kernel + boot-x86_64 + kernel-bin-x86_64);
# `hal-x86_64` is not on that list, so its debug-irq has to ride
# through one of the selected packages' feature graphs to take
# effect. Without this chain, the fault-printer + decoder in
# `hal-x86_64::fault` were silently disabled in production
# (latent since P1-86a / #160).
debug-irq  = ["hal-x86_64/debug-irq"]
# dtrace probes (direct-UART structured trace, bypassing klog/lock).
# Forwarded to `kernel` where the macros live; xtask --features
# debug-trace lights up kmain/debug-trace via this chain (same
# pattern as debug-irq).
debug-trace = ["kmain/debug-trace"]
# Spin-stall probe (`sync` debug-smp). Rides the kmain feature graph so xtask
# `--features debug-smp` reaches sched+sync and names a livelocked lock's rank.
debug-smp = ["kmain/debug-smp"]
# Heap poison+quarantine UAF localizer (`kalloc` debug-heappoison). Rides kmain
# so `--features debug-heappoison` reaches kalloc and prints [UAF-WRITE*]/[UAF].
debug-heappoison = ["kmain/debug-heappoison"]
# Retained Linux CONFIG_ZRAM_MEMORY_TRACKING-equivalent debugfs ABI. xtask
# selects boot + kmain together, so this forwards its one feature spelling.
debug-zram = ["kmain/debug-zram"]
# Retained executable-scoped trace for the injected ZRAM lifecycle corpus.
debug-zram-lifecycle = ["kmain/debug-zram-lifecycle"]
debug-netlink = ["kmain/debug-netlink"]
# Retained executable-scoped OpenSSH syscall trace; avoids global serial tracing.
debug-sshd = ["kmain/debug-sshd"]
debug-getdents = ["kmain/debug-getdents"]
debug-getdents-detail = ["kmain/debug-getdents-detail"]
# Liveness watchdog + serial-sysrq task dump (`05`/`27`). Rides the
# kmain feature graph so xtask `--features debug-watchdog` reaches sched.
debug-watchdog = ["kmain/debug-watchdog", "hal-x86_64/debug-watchdog"]
# Periodic retained task-state dump for deadlock triage; no output until enabled.
debug-taskdump = ["kmain/debug-taskdump"]
debug-all  = ["debug-boot", "debug-irq", "debug-trace", "debug-watchdog"]
