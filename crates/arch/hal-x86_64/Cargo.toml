[package]
name = "hal-x86_64"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
hal      = { path = "../../arch/hal" }
klog     = { path = "../../shared/klog" }
kalloc   = { path = "../../shared/kalloc" }
sync     = { path = "../../shared/sync" }
syscall  = { path = "../../kernel/syscall" }
pci      = { path = "../../drivers/pci" }
bitflags = { version = "2", default-features = false }

[features]
default   = []
# Per `04§4.0` (R06): gates this crate's klog call sites — the
# CPU-exception fault printer (`fault.rs`) emits via klog::write_raw
# / write_hex_u64 only under `debug-irq`. Default builds halt
# silently on a fault. Mirrors `kernel`'s `debug-irq` so xtask
# `--features debug-irq` enables both.
debug-irq = []
# Gates the vector-2 NMI backtrace emit (cross-CPU lockup poke). Forwarded
# default-on via boot-x86_64 so the handler prints in every build; without
# it the NMI is still handled (print skipped) and iretq-resumes.
debug-watchdog = []
debug-all = ["debug-irq", "debug-watchdog"]
# Kalloc corruption hunt (docs/02, dev-only): compile the in-kernel #DB
# (vector 1) hardware-watchpoint handler in `fault.rs` + the DR0/DR1 arming
# primitives in `regs.rs`. Paired with kalloc's `debug-hw-watchpoint` hook,
# which arms a write-watchpoint on the most-recently-freed HoleHdr; a stray
# kernel write to the free node then #DB-traps and this handler prints the
# writer's rip. x86_64-only (aarch64 uses a different debug-register ABI).
debug-hw-watchpoint = []
