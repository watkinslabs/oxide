[package]
name = "boot-aarch64"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
boot-info = { path = "../../shared/boot-info" }
cmdline = { path = "../../kernel/cmdline" }
kmain = { path = "../../kernel/kmain" }
klog         = { path = "../../shared/klog" }
hal          = { path = "../../arch/hal" }
hal-aarch64  = { path = "../../arch/hal-aarch64" }
sync         = { path = "../../shared/sync" }

[features]
# `debug-watchdog` default-ON — see boot-x86_64's note. Armed in every
# build so a flaky hang is caught the first time; silent until a stall
# fires or sysrq is triggered (R06 zero-bytes-when-healthy preserved).
default    = ["debug-watchdog"]
hosted     = []
# Per `04§4.0` (R06): gates this crate's klog call sites
# (UART sink install + CPU/MMU dump + pl011 sink swap) so
# default builds emit zero log bytes. Mirrors `kernel`'s
# `debug-boot`; xtask `--features debug-boot` enables both
# because cargo applies `--features` to every selected `-p`
# package that declares it.
debug-boot = []
# Pass-through to `hal-aarch64`'s `debug-irq`. See the matching
# comment in `crates/boot-x86_64/Cargo.toml` — xtask only `-p`s
# kernel + boot-aarch64 + kernel-bin-aarch64, so hal-aarch64's
# debug-irq has to ride through this chain to take effect.
debug-irq  = ["hal-aarch64/debug-irq"]
# Liveness watchdog + serial-sysrq task dump (`05`/`27`); rides kmain.
debug-watchdog = ["kmain/debug-watchdog", "hal-aarch64/debug-watchdog"]
# Periodic retained task-state dump for deadlock triage; no output until enabled.
debug-taskdump = ["kmain/debug-taskdump"]
# Spin-stall probe (`sync` debug-smp): names a livelocked lock's rank. Rides kmain.
debug-smp = ["kmain/debug-smp"]
# Heap poison+quarantine UAF localizer (`kalloc` debug-heappoison). Rides kmain.
debug-heappoison = ["kmain/debug-heappoison"]
# Task-owned FP/SIMD provenance before raw scheduler/ptrace access.
debug-task-fpu-provenance = ["kmain/debug-task-fpu-provenance"]
# Retained Linux CONFIG_ZRAM_MEMORY_TRACKING-equivalent debugfs ABI.
debug-zram = ["kmain/debug-zram"]
# Retained executable-scoped trace for the injected ZRAM lifecycle corpus.
debug-zram-lifecycle = ["kmain/debug-zram-lifecycle"]
debug-netlink = ["kmain/debug-netlink"]
debug-arm-mprotect = ["kmain/debug-arm-mprotect"]
debug-arm-mprotect-detail = ["kmain/debug-arm-mprotect-detail"]
debug-arm-mprotect-pages = ["kmain/debug-arm-mprotect-pages"]
# Executable-scoped OpenSSH lifecycle markers; avoids global serial tracing.
debug-sshd = ["kmain/debug-sshd"]
debug-sshd-detail = ["kmain/debug-sshd-detail"]
debug-getdents = ["kmain/debug-getdents"]
debug-getdents-detail = ["kmain/debug-getdents-detail"]
debug-syscall-return = ["kmain/debug-syscall-return"]
debug-all  = ["debug-boot", "debug-irq", "debug-watchdog"]
