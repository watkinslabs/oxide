# oxide-libc — glibc-ABI C standard library, in Rust. Spec: docs/59.
# rlib here = joins workspace build + hosted differential oracle tests.
# The shipped libc.so.6 / libc.a are produced by `xtask glibc`, which
# rebuilds with --crate-type cdylib/staticlib + the version script
# (glibc.ld.version) + freestanding link flags. See docs/59§3,§5.
[package]
name = "glibc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
# hosted: pull std so tests can call the host system glibc for the
# differential oracle (docs/59§7).
hosted = ["nss/hosted", "crypt/hosted"]
# freestanding: real shipped-libc build (no_std final artifact). Set by
# `xtask glibc` together with --crate-type cdylib/staticlib.
freestanding = []
# crt: the crt1.o role — the `_start` entry that references the app `main`.
# Belongs in the static-link archive / Scrt1, NOT in libc.so.6 (which would
# get an unresolvable PC32 ref to an external `main`). Implies freestanding.
crt = ["freestanding"]

[dependencies]
nss = { path = "../nss" }
crypt = { path = "../../shared/crypt" }

# Differential oracle (docs/59§7): compare our impls against the host
# glibc. Test-only; never linked into the shipped libc.
[dev-dependencies]
libc = "0.2"
proptest = "1"
