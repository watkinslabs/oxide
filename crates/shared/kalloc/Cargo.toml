[package]
name = "kalloc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
sync = { path = "../../shared/sync" }
klog = { path = "../../shared/klog", optional = true }

[features]
default = []
hosted  = []
# Diagnostic UAF localizer: poison + quarantine freed blocks (docs/02, dev-only).
debug-heappoison = ["dep:klog"]
debug-smp = ["dep:klog"]
# Diagnostic-only: print the HoleListError tag before the plain (non-
# debug-heappoison) dealloc path's invariant assert fires. Zero-cost on
# the success path (only reads on the Err branch, right before a panic
# that was about to happen anyway); does not change alloc/dealloc
# timing or memory layout the way debug-heappoison's poison+quarantine
# logic does, so it preserves the fast (~15s) smoke-profile repro of
# this session's kalloc corruption hunt (docs/02, dev-only).
debug-dealloc-diag = ["dep:klog"]
# Diagnostic-only: after a block becomes a genuine free-list HoleHdr in
# `dealloc`, invoke an installed hook (`set_watchpoint_hook`) that arms an
# x86_64 hardware WRITE watchpoint (DR0/DR1) on that block's 16 bytes. A
# stray kernel write to the freed node then raises #DB, and hal-x86_64's
# in-kernel handler prints the writer's rip. kalloc has no HAL dep, so the
# actual debug-register arming is wired kernel-side via the hook. Single
# most-recently-freed block (v1 scope). Zero cost when off (docs/02).
debug-hw-watchpoint = []
# Electric-fence UAF-writer localizer (C213): route the small-object size class
# to the `efence` crate's page-per-object guard arena. `alloc` consults an
# installed hook; `dealloc` range-checks the ptr against the arena window and
# hands fenced frees back to the arena (which flips them RO). kalloc has no HAL
# dep, so the arena (which needs MmuOps) lives in `efence` and installs the
# hooks here. Zero cost when off (docs/02, dev-only).
debug-efence = ["dep:klog"]
