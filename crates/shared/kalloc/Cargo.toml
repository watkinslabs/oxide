[package]
name = "kalloc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
sync = { path = "../../shared/sync" }
klog = { path = "../../shared/klog", optional = true }

[features]
default = []
hosted  = []
# Diagnostic UAF localizer: poison + quarantine freed blocks (docs/02, dev-only).
debug-heappoison = ["dep:klog"]
debug-smp = ["dep:klog"]
# Diagnostic-only: print the HoleListError tag before the plain (non-
# debug-heappoison) dealloc path's invariant assert fires. Zero-cost on
# the success path (only reads on the Err branch, right before a panic
# that was about to happen anyway); does not change alloc/dealloc
# timing or memory layout the way debug-heappoison's poison+quarantine
# logic does, so it preserves the fast (~15s) smoke-profile repro of
# this session's kalloc corruption hunt (docs/02, dev-only).
debug-dealloc-diag = ["dep:klog"]
