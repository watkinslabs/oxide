# The AArch64 probes cross-link with the system GNU toolchain against Fedora's
# cross sysroot — the same compiler and sysroot `tools/xtask/src/rootfs_disks.rs`
# uses for the C probes, so both arches resolve the identical glibc ABI.
#
# `--sysroot` is required: the cross compiler's own default sysroot carries only
# startup/runtime pieces, so without it the link fails on `-lc` and `crtn.o`.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "link-arg=--sysroot=/usr/aarch64-redhat-linux/sys-root/fc42"]
