[workspace]
resolver = "2"
# Vendored third-party crates are path dependencies living INSIDE the workspace
# root, which makes them implicit members. `cargo test --workspace` then builds
# their test targets under our feature resolution -- and we select
# `default-features=false` on zlib-rs for the kernel, so `std` is off and its
# own tests fail with 111 "cannot find module or crate `std`" errors. That took
# the whole-workspace test gate away from every lane, which then fell back to
# per-crate runs and reported it as "pre-existing breakage on main".
# Excluding them restores `cargo test --workspace`; we do not test vendor code.
exclude = ["vendor/rust/zlib-rs-0.6.6", "vendor/rust/structured-zstd-0.0.49"]
members = ["tools/spec-lint", "tools/xtask", "crates/arch/hal", "crates/arch/hal-x86_64", "crates/arch/hal-aarch64", "crates/shared/klog", "crates/shared/kmacros", "crates/shared/sync", "crates/shared/kalloc", "crates/shared/movable", "crates/arch/limine-proto", "crates/arch/boot-x86_64", "crates/arch/boot-aarch64", "crates/shared/boot-info", "crates/kernel/cpu", "crates/kernel/crng", "crates/kernel/aslr", "crates/kernel/kernfs", "crates/kernel/devfs", "crates/kernel/exec", "crates/kernel/arch-irq", "crates/kernel/softirq", "crates/arch/kernel-bin-x86_64", "crates/arch/kernel-bin-aarch64", "crates/kernel/mm-pmm", "crates/kernel/mmio-map", "crates/kernel/efence", "crates/shared/slab", "crates/kernel/mm-vmm", "crates/kernel/namespace-identity", "crates/kernel/network-namespace", "crates/kernel/time-namespace", "crates/kernel/user-namespace", "crates/kernel/ucounts", "crates/kernel/sched", "crates/kernel/pidfd", "crates/kernel/fs", "crates/kernel/umh", "crates/kernel/syscall", "crates/kernel/uaccess", "crates/kernel/vfs", "crates/kernel/block", "crates/kernel/ext4", "crates/kernel/input", "crates/kernel/modules", "crates/kernel/procfs", "crates/kernel/ipc", "crates/kernel/security", "crates/kernel/landlock", "crates/kernel/nscg", "crates/kernel/cgroup", "crates/kernel/net", "crates/kernel/netlink", "crates/kernel/socket", "crates/kernel/netfilter", "crates/kernel/tty", "crates/kernel/vt", "crates/kernel/vtconsole", "crates/kernel/serialtty", "crates/kernel/tty-integration", "crates/kernel/console", "crates/kernel/devpts", "crates/kernel/tracefs", "crates/kernel/smoke", "crates/kernel/syscalls", "crates/kernel/pci-boot", "crates/kernel/cmdline", "crates/kernel/timer", "crates/kernel/kmain", "crates/kernel/sysfs", "crates/shared/elf", "crates/kernel/power", "crates/kernel/firmware", "crates/drivers/pci", "crates/drivers/drv", "crates/drivers/drv-virtio-gpu", "crates/drivers/drv-virtio-input", "crates/drivers/drv-virtio-net", "crates/drivers/drv-virtio-blk", "crates/drivers/drv-virtio-rng", "crates/drivers/drv-virtio-vsock", "crates/drivers/drv-virtio-snd", "crates/kernel/sound", "crates/drivers/drv-nvme", "crates/drivers/drv-ahci", "crates/drivers/drv-serial", "crates/drivers/drv-uart-16550", "crates/drivers/drv-uart-pl011", "crates/drivers/drv-zram", "crates/drivers/drv-ps2-keyboard", "crates/drivers/drm", "crates/drivers/fbdev", "crates/drivers/fbcon", "crates/drivers/vt", "crates/shared/err", "crates/shared/crc", "crates/drivers/virtio", "crates/shared/crypt", "crates/shared/mpi", "crates/shared/pkey", "crates/shared/siphash", "crates/shared/zstd", "crates/kernel/conformance"]

# check-cfg (`unexpected_cfgs`) for the whole workspace. Members opt in with
# `[lints]\nworkspace = true`; a new crate that omits it silently loses the
# extension, so keep the stanza in every member Cargo.toml.
#
# `target_os = "oxide-kernel"` is our custom target (`targets/*.json`, `07`).
# rustc's built-in expected-value list for `target_os` is generated from the
# built-in target list, so every one of the ~1700 `cfg(target_os =
# "oxide-kernel")` sites warned on any host build (`cargo test`). Extending the
# value set here fixes it centrally; per-file `#[allow]` would have buried the
# genuinely-unknown cfg values this lint exists to find (it caught six phantom
# `feature = "debug-*"` gates in this same pass).
#
# `loom` is set via RUSTFLAGS by `xtask test --loom`; it was declared per-crate
# in `net` + `network-namespace` before, and moved here because `[lints]
# workspace = true` replaces a crate's whole lints table.
#
# level stays `warn`, NOT `allow`: an unexpected cfg that is not one of these
# two is a real bug (dead code behind a feature nobody declared).
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("oxide-kernel"))',
    'cfg(loom)',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "limited"
overflow-checks = false
incremental = false

[profile.dev]
opt-level = 1
lto = "off"
codegen-units = 16
panic = "abort"
debug = "line-tables-only"
overflow-checks = true
incremental = true
